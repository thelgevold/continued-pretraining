services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
    environment:
      EVAL_API_BASE_URL: http://127.0.0.1:8000
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:?Missing OLLAMA_MODEL_NAME}
      HISTORIC_SITE_MCP_URL: http://historic-site-rag:8001/mcp
      CITY_ANNOUNCEMENTS_PATH: /app/city_announcements
      CITY_ANNOUNCEMENTS_CHROMA_PATH: /app/city_announcements/chroma_db
    depends_on:
      ollama:
        condition: service_healthy
      historic-site-rag:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
      - ./eval:/app/eval
      - ./city_training:/app/city_training:ro
      - ./city_announcements:/app/city_announcements

  historic-site-rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    volumes:
      - ./rag/app:/app/rag/app
      - ./rag/documents:/app/rag/documents:ro
      - ./shared:/app/shared

  subway-rag-api:
    build:
      context: .
      dockerfile: subway_rag/Dockerfile
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SUBWAY_RAG_BASE_MODEL: ${SUBWAY_RAG_BASE_MODEL:?Missing SUBWAY_RAG_BASE_MODEL}
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "8002:8000"
    volumes:
      - ./subway_rag/app:/app/subway_rag/app
      - ./rag/documents/subway_network.txt:/app/documents/subway_network.txt:ro
      - ./eval:/app/eval
      - ./city_training:/app/city_training:ro

  ollama:
    build:
      context: .
      dockerfile: ollama/Dockerfile
    environment:
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME:?Missing OLLAMA_MODEL_NAME}
    gpus: all
    ports:
      - "11437:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./training/outputs/ollama/model_gguf:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$$OLLAMA_MODEL_NAME\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  training:
    profiles: ["training"]
    build:
      context: .
      dockerfile: training/Dockerfile
    environment:
      TRAINING_BASE_MODEL: ${TRAINING_BASE_MODEL:?Missing TRAINING_BASE_MODEL}
      TRAINING_PIPELINE_MODE: ${TRAINING_PIPELINE_MODE:?Missing TRAINING_PIPELINE_MODE}
      TRAINING_CORPUS_PATH: ${TRAINING_CORPUS_PATH:?Missing TRAINING_CORPUS_PATH}
      TRAINING_OUTPUT_DIR: ${TRAINING_OUTPUT_DIR:?Missing TRAINING_OUTPUT_DIR}
      HF_DEACTIVATE_ASYNC_LOAD: "1"
    volumes:
      - ./training:/workspace/training
      - ./city_training:/workspace/city_training
      - ./model_export:/workspace/model_export:ro
      - ./eval:/workspace/eval:ro
      - huggingface-cache:/workspace/.cache/huggingface
    gpus: all

  schema-training:
    profiles: ["schema-training"]
    build:
      context: .
      dockerfile: training/Dockerfile
    entrypoint: ["python", "-m", "schema_training.train"]
    environment:
      SCHEMA_SFT_BASE_MODEL: ${SCHEMA_SFT_BASE_MODEL}
      SCHEMA_SFT_CORPUS_PATH: ${SCHEMA_SFT_CORPUS_PATH}
      SCHEMA_SFT_OUTPUT_DIR: ${SCHEMA_SFT_OUTPUT_DIR}
      SCHEMA_SFT_OUTPUT_DIRECTORY_NAME: ${SCHEMA_SFT_OUTPUT_DIRECTORY_NAME}
      HF_DEACTIVATE_ASYNC_LOAD: "1"
    volumes:
      - ./training:/workspace/training
      - ./schema_training:/workspace/schema_training
      - ./city_training:/workspace/city_training:ro
      - ./model_export:/workspace/model_export:ro
      - huggingface-cache:/workspace/.cache/huggingface
    gpus: all

volumes:
  ollama-data:
  huggingface-cache:
